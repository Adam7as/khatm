<style>
/* Layout: one column of 30 juz cards, each a single player with its 8 readers listed beneath; sticky player docked at the bottom */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --fg: #19221e;
  --muted: #5d6b64;
  --line: #dde3de;
  --accent: #1d6a55;
  --accent-soft: #e2efe9;
  --gold: #9c7a2c;
  --err: #b3402f;
  --font-ar: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --font-display: var(--font-ar);
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --fg: #e5ebe7; --muted: #93a39b; --line: #26312d;
    --accent: #5cc0a0; --accent-soft: #1b2e27; --gold: #d2ad59; --err: #e5826f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --fg: #e5ebe7; --muted: #93a39b; --line: #26312d;
  --accent: #5cc0a0; --accent-soft: #1b2e27; --gold: #d2ad59; --err: #e5826f; color-scheme: dark;
}
html[lang="ru"] {
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 820px; margin: 0 auto; }
header { padding-block: 28px 18px; display: grid; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
html[lang="ru"] .eyebrow { letter-spacing: .12em; text-transform: uppercase; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: none; border-radius: 999px; padding: 4px 14px; font-size: 13px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.lang .ar-lbl { font-family: var(--font-ar); font-size: 16px; line-height: 1.2; }
h1 { font: 700 clamp(36px, 8vw, 58px)/1.1 var(--font-display); margin: 0; text-wrap: balance; }
html[lang="ru"] h1 { font-weight: 600; line-height: 1.02; }
.lead { color: var(--muted); max-width: 62ch; margin: 0; }
.ar { font-family: var(--font-ar); }
.arx { font-family: var(--font-ar); direction: rtl; unicode-bidi: isolate; }

h2.sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 4px; }
.readers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 18px; margin: 0; padding: 0; list-style: none; }
.readers li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.idx { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 600; min-width: 1.4em; flex: none; text-align: end; }
.readers .nm { min-width: 0; flex: 1; }
.readers .alt { color: var(--muted); font-size: 15px; display: block; text-align: left; }
.tag { font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; white-space: nowrap; font-weight: 500; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 14px; }
.toolbar .hint { color: var(--muted); font-size: 13px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--bg); }
.btn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }

.juz { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; padding: 16px; display: grid; gap: 12px; }
.juz.now { border-color: var(--accent); }
.jh { display: flex; align-items: center; gap: 14px; }
.jplay { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); display: grid; place-items: center; flex: none; }
.jplay svg { width: 22px; height: 22px; fill: currentColor; }
.jt { flex: 1; min-width: 0; }
.jt h3 { margin: 0; font: 700 26px/1.2 var(--font-display); }
html[lang="ru"] .jt h3 { font-weight: 600; font-variant-numeric: lining-nums; }
.jt .sub { color: var(--muted); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.jbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; gap: 2px; }
.jbar i { flex: 1; background: var(--line); position: relative; overflow: hidden; }
.jbar i::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--w, 0%); background: var(--gold); }
.jbar { background: none; }
.rubs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 14px; }
.rub { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; cursor: pointer; min-width: 0; }
.rub:hover { background: var(--accent-soft); }
.rub.playing { background: var(--accent-soft); }
.rub.playing .rn { color: var(--accent); }
.mark { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; flex: none; min-width: 2.6em; }
.rn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr { color: var(--muted); font-family: var(--font-ar); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-inline-start: auto; flex-shrink: 1; min-width: 0; }
.jf { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status.err { color: var(--err); }

.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -8px 24px rgba(0,0,0,.06);
}
.pl { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.np { min-width: 0; }
.np .who-now { font: 700 21px/1.3 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .where { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.np .where .arx { font-size: 16px; color: var(--fg); }
.ctl { display: flex; gap: 6px; align-items: center; direction: ltr; }
.ic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.ic:hover { border-color: var(--accent); color: var(--accent); }
.ic svg { width: 16px; height: 16px; fill: currentColor; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); display: grid; place-items: center; }
.play svg { width: 22px; height: 22px; fill: currentColor; }
[dir="rtl"] .ctl { flex-direction: row-reverse; }
[dir="rtl"] .ctl .ic svg { transform: scaleX(-1); }
.bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; margin-inline-start: 0; }
footer { color: var(--muted); font-size: 13px; padding-block: 24px; max-width: 65ch; }
footer a { color: var(--accent); }
@media (max-width: 560px) {
  .rubs { grid-template-columns: minmax(0, 1fr); }
  .np .who-now { font-size: 18px; }
  .jt h3 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      for (let a = from; a <= to; a++) out.push({ url: EA + r.src + "/" + pad3(s) + pad3(a) + ".mp3", s, a });
    } else {
      const key = r.timed.key, t = timing[key][s];
      out.push({
        url: r.timed.base + pad3(s) + ".mp3", s, a: from, aTo: to, timed: true, key,
        start: from === 1 ? 0 : t[from - 1][0] / 1000,
        end: to === counts[s - 1] ? null : t[to - 1][1] / 1000,
      });
    }
  }
  return out;
}

/* ---------- Отрисовка ---------- */
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24"><path d="M11 3h2v10l4-4 1.4 1.4L12 16.8 5.6 10.4 7 9l4 4zM5 19h14v2H5z"/></svg>';
const tag = r => r.mujawwad ? ` <span class="tag">${L().mujawwad}</span>` : "";

function render() {
  const t = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = t[e.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("prev").setAttribute("aria-label", t.prev);
  $("next").setAttribute("aria-label", t.next);

  $("readers").innerHTML = READERS.map((r, i) =>
    `<li><span class="idx">${num(i + 1)}</span><span class="nm"><span class="${lang === "ar" ? "ar" : ""}">${rname(r)}</span>${tag(r)}${lang === "ru" ? `<span class="alt arx">${r.ar}</span>` : ""}</span></li>`
  ).join("");

  let html = "";
  for (let j = 0; j < 30; j++) {
    const first = j * PER_JUZ, last = first + PER_JUZ - 1;
    const ps = PARTS[first], pe = PARTS[last];
    html += `<section class="juz" id="juz${j}">
      <div class="jh">
        <button class="jplay" type="button" data-juz="${j}" aria-label="${t.playJuz(j + 1)}">${ICON_PLAY}</button>
        <div class="jt"><h3>${t.juz(j + 1)}</h3><span class="sub arx">${names[ps[0] - 1]} ${arNum(ps[1])} – ${names[pe[2] - 1]} ${arNum(pe[3])}</span></div>
      </div>
      <div class="jbar" id="jb${j}">${"<i></i>".repeat(PER_JUZ)}</div>
      <ol class="rubs">`;
    for (let p = first; p <= last; p++) {
      const r = reader(p);
      html += `<li class="rub" id="p${p}" data-play="${p}" tabindex="0" title="${t.rub(p + 1)}">
        <span class="mark">۞ ${num(p + 1)}</span>
        <span class="rn${lang === "ar" ? " ar" : ""}">${rname(r)}</span>${tag(r)}
        <span class="rr">${rangeText(PARTS[p])}</span></li>`;
    }
    html += `</ol><div class="jf"><button class="btn" type="button" data-zip="${j}">${ICON_DL}<span>${t.dl}</span></button><span class="status" id="st${j}"></span></div></section>`;
  }
  $("list").innerHTML = html;
  if (resumable) {
    $("resume").textContent = t.resume;
    $("resumeHint").textContent = t.resumeHint(part + 1, juzOf(part) + 1);
  } else { $("resume").textContent = t.fromStart; $("resumeHint").textContent = ""; }
  show(); setIcon();
}

/* ---------- Плеер ---------- */
const els = [$("a0"), $("a1")];
let cur = 0, part = 0, idx = 0, items = itemsFor(0), playing = false, stopTimer = null, started = false, resumable = false;

function save() { try { localStorage.setItem("khatm-pos", JSON.stringify({ part, idx })); } catch (e) {} }
function loadPos() { try { return JSON.parse(localStorage.getItem("khatm-pos")); } catch (e) { return null; } }

function nextRef(p, i) {
  const it = itemsFor(p);
  if (i + 1 < it.length) return [p, i + 1];
  return p + 1 < N ? [p + 1, 0] : null;
}

function show() {
  const r = reader(part), j = juzOf(part), t = L();
  $("npWho").textContent = started || resumable ? rname(r) + (r.mujawwad ? " · " + t.mujawwad : "") : t.start;
  $("npPos").textContent = t.pos(j + 1, part + 1);
  document.querySelectorAll(".rub.playing").forEach(e => e.classList.remove("playing"));
  document.querySelectorAll(".juz.now").forEach(e => e.classList.remove("now"));
  $("p" + part).classList.add("playing");
  $("juz" + j).classList.add("now");
  updateAyah();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: rname(r), artist: t.juz(j + 1), album: t.title });
  }
}

function rubFraction() {
  const it = items[idx]; if (!it) return 0;
  if (it.timed) {
    const el = els[cur], span = (it.end ?? el.duration) - it.start;
    const within = span > 0 && isFinite(span) ? Math.max(0, Math.min(1, (el.currentTime - it.start) / span)) : 0;
    return (idx + within) / items.length;
  }
  return idx / items.length;
}

function updateAyah() {
  const it = items[idx]; if (!it) return;
  let s = it.s, a = it.a;
  if (it.timed) {
    const t = timing[it.key][s], ms = els[cur].currentTime * 1000;
    while (a < it.aTo && t[a] && t[a][0] <= ms) a++;
  }
  $("npAyah").textContent = a === 0 ? L().basmala : `${names[s - 1]} ${arNum(a)}`;
  const f = rubFraction(), j = juzOf(part), k = part - j * PER_JUZ;
  $("barFill").style.width = ((k + f) / PER_JUZ * 100).toFixed(1) + "%";
  document.querySelectorAll(".jbar i").forEach(e => e.style.removeProperty("--w"));
  const bars = $("jb" + j).children;
  for (let q = 0; q < PER_JUZ; q++) bars[q].style.setProperty("--w", q < k ? "100%" : q === k ? (f * 100).toFixed(1) + "%" : "0%");
}

function setIcon() {
  $("ppIcon").innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $("pp").setAttribute("aria-label", playing ? L().pause : L().play);
  document.querySelectorAll(".jplay").forEach(b => {
    const on = playing && +b.dataset.juz === juzOf(part);
    b.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    b.setAttribute("aria-label", on ? L().pause : L().playJuz(+b.dataset.juz + 1));
  });
}

function preloadNext() {
  const n = nextRef(part, idx); const b = els[1 - cur];
  if (!n) return;
  const it = itemsFor(n[0])[n[1]];
  if (b.dataset.url !== it.url) { b.dataset.url = it.url; b.src = it.url; b.load(); }
}

function watchEnd() {
  clearInterval(stopTimer);
  const it = items[idx], el = els[cur];
  if (it.timed && it.end != null) stopTimer = setInterval(() => { if (el.currentTime >= it.end) advance(); }, 80);
}

function startItem() {
  const it = items[idx], el = els[cur];
  started = true;
  els[1 - cur].pause();
  const go = () => {
    if (it.timed && Math.abs(el.currentTime - it.start) > 0.5) el.currentTime = it.start;
    else if (!it.timed && el.currentTime > 0 && el.ended) el.currentTime = 0;
    el.play().catch(() => { playing = false; setIcon(); });
  };
  if (el.dataset.url !== it.url) { el.dataset.url = it.url; el.src = it.url; }
  if (el.readyState >= 1) go(); else el.addEventListener("loadedmetadata", go, { once: true });
  watchEnd(); show(); save(); preloadNext();
}

function advance() {
  clearInterval(stopTimer);
  const n = nextRef(part, idx);
  els[cur].pause();
  if (!n) { playing = false; setIcon(); return; }
  const newPart = n[0] !== part;
  if (newPart) { part = n[0]; items = itemsFor(part); }
  idx = n[1];
  if (els[1 - cur].dataset.url === items[idx].url) cur = 1 - cur;
  startItem();
  if (newPart) setIcon();
}

els.forEach((el, k) => {
  el.addEventListener("ended", () => { if (k === cur && playing) advance(); });
  el.addEventListener("timeupdate", () => { if (k === cur) updateAyah(); });
  el.addEventListener("error", () => { if (k === cur && playing) setTimeout(advance, 400); });
});

function playPart(p, i = 0) {
  part = p; idx = i; items = itemsFor(p); playing = true; resumable = false; setIcon(); startItem();
}
function toggle() {
  if (!playing) {
    playing = true; setIcon();
    const el = els[cur];
    if (el.dataset.url === items[idx].url && el.currentTime > 0 && !el.ended) { el.play(); watchEnd(); }
    else startItem();
  } else { playing = false; setIcon(); els[cur].pause(); clearInterval(stopTimer); }
}

$("pp").onclick = toggle;
$("prev").onclick = () => playPart(Math.max(0, part - (idx > 0 ? 0 : 1)));
$("next").onclick = () => { if (part + 1 < N) playPart(part + 1); };
$("resume").onclick = () => playPart(part, 0);
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => { if (!playing) toggle(); });
  navigator.mediaSession.setActionHandler("pause", () => { if (playing) toggle(); });
  navigator.mediaSession.setActionHandler("previoustrack", () => $("prev").onclick());
  navigator.mediaSession.setActionHandler("nexttrack", () => $("next").onclick());
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]");
  if (l) { lang = l.dataset.lang; try { localStorage.setItem("khatm-lang", lang); } catch (x) {} render(); return; }
  const j = e.target.closest("[data-juz]");
  if (j) { const n = +j.dataset.juz; if (juzOf(part) === n && (playing || started)) toggle(); else playPart(n * PER_JUZ); return; }
  const r = e.target.closest("[data-play]");
  if (r) { playPart(+r.dataset.play); return; }
  const z = e.target.closest("[data-zip]");
  if (z) downloadJuz(+z.dataset.zip, z);
});
document.addEventListener("keydown", e => {
  const r = e.target.closest && e.target.closest("[data-play]");
  if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); playPart(+r.dataset.play); }
});

const saved = loadPos();
if (saved && saved.part > 0 && saved.part < N) { part = saved.part; idx = 0; items = itemsFor(part); resumable = true; }
render();
if (resumable) $("juz" + juzOf(part)).scrollIntoView({ block: "center" });

/* ---------- Скачивание ---------- */
const BR1 = [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320], BR2 = [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
function frameLen(b, p) {
  if (p + 4 > b.length || b[p] !== 0xFF || (b[p + 1] & 0xE0) !== 0xE0) return 0;
  const ver = (b[p + 1] >> 3) & 3, layer = (b[p + 1] >> 1) & 3, bi = b[p + 2] >> 4, si = (b[p + 2] >> 2) & 3, pad = (b[p + 2] >> 1) & 1;
  if (ver === 1 || layer !== 1 || bi === 0 || bi === 15 || si === 3) return 0;
  const sr = [44100, 48000, 32000][si] / (ver === 3 ? 1 : ver === 2 ? 2 : 4);
  const br = (ver === 3 ? BR1 : BR2)[bi] * 1000;
  return Math.floor((ver === 3 ? 144 : 72) * br / sr) + pad;
}
function syncAt(b, from) {
  for (let p = from; p < b.length - 4; p++) {
    const l = frameLen(b, p);
    if (l && frameLen(b, p + l)) return p;
  }
  return -1;
}
function id3Size(b) {
  return b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33 ? 10 + ((b[6] & 127) << 21 | (b[7] & 127) << 14 | (b[8] & 127) << 7 | (b[9] & 127)) : 0;
}
// Убирает теги и служебный кадр Xing/Info, чтобы склеенные куски читались как один файл.
function cleanMp3(b, skipLeadingTag = true) {
  let end = b.length;
  if (end > 128 && b[end - 128] === 0x54 && b[end - 127] === 0x41 && b[end - 126] === 0x47) end -= 128;
  let p = syncAt(b, skipLeadingTag ? id3Size(b) : 0);
  if (p < 0) return new Uint8Array(0);
  const l = frameLen(b, p);
  const head = new TextDecoder("latin1").decode(b.subarray(p, p + Math.min(l, 200)));
  if (/Xing|Info|VBRI/.test(head)) p += l;
  return b.subarray(p, end);
}
async function getBytes(url, range) {
  for (let t = 0; t < 4; t++) {
    try {
      const r = await fetch(url, range ? { headers: { Range: range } } : {});
      if (!r.ok) throw new Error(r.status);
      return { buf: new Uint8Array(await r.arrayBuffer()), res: r };
    } catch (e) { if (t === 3) throw e; await new Promise(z => setTimeout(z, 800 * (t + 1))); }
  }
}
const sizeCache = {};
async function timedBytes(it) {
  if (!sizeCache[it.url]) {
    const { buf, res } = await getBytes(it.url, "bytes=0-9");
    const total = +((res.headers.get("Content-Range") || "").split("/")[1]);
    sizeCache[it.url] = { total, id3: id3Size(buf) };
  }
  const { total, id3 } = sizeCache[it.url];
  const t = timing[it.key][it.s], dur = t[t.length - 1][1] / 1000;
  const toByte = sec => Math.floor(id3 + (sec / dur) * (total - id3));
  const from = it.start ? Math.max(id3, toByte(it.start) - 4096) : 0;
  const to = it.end == null ? total - 1 : Math.min(total - 1, toByte(it.end) + 4096);
  const { buf } = await getBytes(it.url, `bytes=${from}-${to}`);
  const bytes = from === 0 ? cleanMp3(buf) : cleanMp3(buf.subarray(syncAt(buf, Math.min(4096, buf.length - 1))), false);
  // Места пауз между аятами внутри куска: по ним кусок режется для перекодирования.
  const base = from + bytes.byteOffset;
  bytes.cuts = [];
  for (let a = it.a + 1; a <= it.aTo; a++) {
    const off = toByte(t[a - 1][0] / 1000 - 0.3) - base;
    if (off > 0 && off < bytes.length) bytes.cuts.push(off);
  }
  return bytes;
}
// Записи с пометкой low перекодируются в 44,1 кГц стерео: смену формата посреди файла плееры не выдерживают.
// Режет кусок на части по ~2 МБ, выбирая разрезы в паузах между аятами (cuts) и по границам кадров.
function slicePieces(b, max) {
  const cuts = (b.cuts || []).map(o => syncAt(b, o)).filter(o => o > 0);
  const out = []; let start = 0;
  for (const c of cuts) if (c - start >= max) { out.push(b.subarray(start, c)); start = c; }
  out.push(b.subarray(start));
  return out;
}
const WORKER_SRC = `
importScripts("https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js");
onmessage = e => {
  const { id, pcm } = e.data, enc = new lamejs.Mp3Encoder(2, 44100, 128), out = [], B = 1152 * 20;
  const i16 = new Int16Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) { const v = Math.max(-1, Math.min(1, pcm[i])); i16[i] = v < 0 ? v * 32768 : v * 32767; }
  for (let i = 0; i < i16.length; i += B) { const b = i16.subarray(i, i + B), m = enc.encodeBuffer(b, b); if (m.length) out.push(m); }
  out.push(enc.flush());
  let n = 0; out.forEach(x => n += x.length);
  const res = new Uint8Array(n); let o = 0; out.forEach(x => { res.set(x, o); o += x.length; });
  postMessage({ id, mp3: res }, [res.buffer]);
};`;
let pool = null;
function getPool() {
  if (pool) return pool;
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  const n = Math.max(2, Math.min(6, (navigator.hardwareConcurrency || 4) - 1));
  pool = Array.from({ length: n }, () => ({ w: new Worker(url), busy: false }));
  return pool;
}
const waiters = [], pending = new Map();
function encodeOnWorker(pcm) {
  return new Promise((ok, fail) => {
    const run = slot => {
      slot.busy = true;
      const id = Math.random();
      pending.set(id, ok);
      slot.w.onmessage = e => {
        pending.get(e.data.id)(e.data.mp3); pending.delete(e.data.id);
        slot.busy = false; const nx = waiters.shift(); if (nx) nx(slot);
      };
      slot.w.onerror = () => fail(new Error("encoder"));
      slot.w.postMessage({ id, pcm }, [pcm.buffer]);
    };
    const free = getPool().find(s => !s.busy);
    if (free) run(free); else waiters.push(run);
  });
}
// Декодирует куски нативно и раздаёт кодирование MP3 по ядрам; порядок сохраняется.
async function transcode(chunks, onStep) {
  const ctx = new OfflineAudioContext(1, 1, 44100), jobs = [];
  let batch = [], batchLen = 0, total = 0, done = 0;
  const flush = () => {
    if (!batchLen) return;
    const pcm = new Float32Array(batchLen); let o = 0;
    batch.forEach(x => { pcm.set(x, o); o += x.length; });
    batch = []; batchLen = 0; total++;
    jobs.push(encodeOnWorker(pcm).then(r => { onStep(++done, total); return r; }));
  };
  for (const c of chunks) {
    for (const piece of slicePieces(c, 1 << 21)) {
      let pcm;
      try { pcm = (await ctx.decodeAudioData(piece.slice().buffer)).getChannelData(0); } catch (e) { continue; }
      batch.push(pcm); batchLen += pcm.length;
      if (batchLen > 44100 * 120) flush();
    }
  }
  flush();
  return Promise.all(jobs);
}
async function juzBytes(j, onStep) {
  const jobs = [];
  for (let p = j * PER_JUZ; p < (j + 1) * PER_JUZ; p++) itemsFor(p).forEach(it => jobs.push({ it, p }));
  const out = new Array(jobs.length);
  let next = 0, done = 0;
  async function worker() {
    while (next < jobs.length) {
      const k = next++, { it } = jobs[k];
      out[k] = it.timed ? await timedBytes(it) : cleanMp3((await getBytes(it.url)).buf);
      onStep("load", ++done, jobs.length);
    }
  }
  await Promise.all(Array.from({ length: 4 }, worker));
  // Все части низкого качества перекодируются одновременно, затем собираются по порядку.
  const parts = [];
  let encDone = 0, encTotal = 0;
  for (let p = j * PER_JUZ; p < (j + 1) * PER_JUZ; p++) {
    const mine = out.filter((_, k) => jobs[k].p === p);
    if (reader(p).low) {
      let myTotal = 0;
      parts.push(transcode(mine, (d, n) => { if (n > myTotal) { encTotal += n - myTotal; myTotal = n; } onStep("enc", ++encDone, encTotal); }));
    } else parts.push(Promise.resolve(mine));
  }
  return (await Promise.all(parts)).flat();
}
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function downloadJuz(j, btn) {
  const st = $("st" + j); btn.disabled = true; st.className = "status";
  try {
    const chunks = await juzBytes(j, (ph, d, n) => st.textContent = ph === "load" ? L().loading(d, n) : L().encoding(d, n));
    const blob = new Blob(chunks, { type: "audio/mpeg" });
    saveBlob(blob, L().file(j + 1));
    st.textContent = L().done(num((blob.size / 1048576).toFixed(0)) + " " + L().mb);
  } catch (e) { st.className = "status err"; st.textContent = L().err; }
  btn.disabled = false;
}
